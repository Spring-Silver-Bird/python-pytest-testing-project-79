# =============================================================================
# AI Test Agent - Hexlet page-loader
# =============================================================================
#
# Triggered on PRs to `main`. Runs the opencode agent to:
#   1. Analyse the diff and find code with no pytest coverage.
#   2. Generate pytest tests for uncovered functions in `page_loader/`.
#   3. Commit and push the generated tests back to the PR branch.
#
# Prerequisites:
#   - Node.js (for installing opencode via npm)
#   - Repo secret OPENCODE_API_KEY (or another provider key + model below)
#   - PRs must come from branches in this repo (fork PRs get a read-only token)
#
# Notes:
#   - `.github/workflows/hexlet-check.yml` is auto-generated by Hexlet.
#     Never edit or delete it; this workflow only adds a separate file.
#   - The agent is restricted to `tests/` and must follow project conventions:
#     requests-mock for network, tmp_path for disk, no real side effects.
# =============================================================================

name: AI Test Agent

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Install opencode
        run: |
          npm install -g opencode-ai

      - name: Run AI agent to generate missing tests
        env:
          HEAD_REF: ${{ github.head_ref }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
        run: |
          opencode run --auto --model opencode/big-pickle "
            You are in a GitHub Actions CI runner for a Hexlet page-loader project.
            The checkout contains:

            - page_loader/  - Python package: loader.py, names.py, cli.py
            - tests/        - pytest tests and tests/fixtures/ sample page + assets
            - Makefile      - project commands (make check)

            The PR branch is \"$HEAD_REF\" and the base is \"main\".

            Hard constraints:
            - Do NOT modify anything outside tests/. Never touch source files,
              pyproject.toml, Makefile, or .github/workflows/hexlet-check.yml.
            - Tests must have no real side effects: mock HTTP with requests-mock
              and write files only under pytest tmp_path. Never hit the network.
            - Follow the existing test style and the naming contract:
              https://ru.hexlet.io/courses -> ru-hexlet-io-courses.html,
              resources dir -> ru-hexlet-io-courses_files/,
              resource file -> <dir-name>-<hash-of-resource-url><ext>.
            - Only same-host resources are downloaded; external URLs stay untouched.

            Follow these steps:

            1. Run \"git diff origin/main...HEAD --stat\" to see what files changed.

            2. Run \"poetry run pytest tests/ --cov=page_loader --cov-report=term-missing --tb=short -q 2>&1 || true\"
               to identify functions missing test coverage.

            3. Read each source file that has uncovered functions.

            4. For each uncovered function, read the corresponding existing test file
               (if any) to understand the project's test style, then write new pytest
               tests under tests/ that cover:
               - Normal cases
               - Edge cases (missing output dir, empty HTML, external resources, etc.)
               - Error cases (requests.RequestException, HTTP errors, CLI exit codes)

            5. Before finishing, run:
               - \"poetry run pytest tests/ -v --tb=short -q\"
               - \"poetry run ruff check page_loader tests\"
               Fix any failing tests and lint errors you introduced.

            6. Configure git: git config user.name 'ai-test-agent[bot]'
               and git config user.email 'ai-test-agent[bot]@users.noreply.github.com'

            7. Run \"git add tests/\" and \"git diff --staged --quiet\" to check for changes.
               If there are staged changes, commit with message
               'chore: add AI-generated unit tests for uncovered functions'
               and push to origin HEAD:\"$HEAD_REF\".
          "

      - name: Summary
        run: |
          echo "### AI Test Agent Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PR: ${{ github.event.pull_request.html_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
