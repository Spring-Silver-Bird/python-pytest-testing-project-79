[tool.poetry]
name = "hexlet-code"
version = "0.1.0"
description = "Library and CLI for downloading web pages together with their local resources"
authors = ["Spring-Silver-Bird <adelaida_19@mail.ru>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "page_loader" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
requests-mock = "^1.11.0"
ruff = "^0.4.0"
pytest-cov = "^7.1.0"

[tool.poetry.scripts]
page-loader = "page_loader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--verbosity=1"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]